# Configuração Nixpacks para o Railway (VittaHub backend)
# Instala bibliotecas de sistema necessárias para o Chromium/Puppeteer rodar
[phases.setup]
# ffmpeg: converte o áudio da equipe pra ogg/opus (nota de voz do WhatsApp).
# Instalado como pacote do SISTEMA de propósito: o ffmpeg-static baixa o binário
# na hora do build, e quando esse download falha o áudio vai bruto e o WhatsApp
# recusa calado (03/09). Com o pacote aqui, o conversor existe sempre.
nixPkgs = ["nodejs", "...", "chromium", "ffmpeg"]
aptPkgs = [
  "libnspr4",
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpango-1.0-0",
  "libcairo2",
  "libatspi2.0-0",
  "libxshmfence1",
  "libx11-6",
  "libxcb1",
  "libxext6",
  "libxi6",
  "libxtst6",
  "fonts-liberation",
  "libappindicator3-1",
  "libdbus-1-3"
]
