name: Diagnostico da producao

# 🩺 Mede o servidor de produção de fora (25/09, "sistema com muita
# instabilidade"): o ambiente do Claude não alcança o Railway, o GitHub alcança.
# Roda em push na branch de trabalho do Claude (a main é que faz deploy) ou à mão.
on:
  workflow_dispatch:
  push:
    branches: [claude/practical-dirac-i5mr3j]
    paths: ['.github/workflows/diagnostico-producao.yml']

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Medir
        run: |
          B=https://vittahub-backend-production.up.railway.app
          for i in 1 2 3 4 5 6; do
            echo "=== rodada $i $(date -u +%H:%M:%S)"
            curl -s -m 20 -o /tmp/h -w "health %{http_code} %{time_total}s\n" $B/api/health || true; cat /tmp/h 2>/dev/null; echo
            curl -s -m 20 -o /tmp/v -w "versao %{http_code} %{time_total}s\n" $B/api/versao || true; cat /tmp/v 2>/dev/null | head -c 700; echo
            curl -s -m 30 -o /tmp/l -w "login-falso %{http_code} %{time_total}s\n" -X POST $B/api/auth/login -H 'content-type: application/json' -d '{"login":"000.000.000-00","senha":"x"}' || true; cat /tmp/l 2>/dev/null; echo
            sleep 15
          done
